[package]
name = "framestudio-desktop"
version = "0.1.0"
description = "FrameStudio AI — editor de vídeo (app desktop)"
edition = "2021"
license = "MIT"

[lib]
name = "framestudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
