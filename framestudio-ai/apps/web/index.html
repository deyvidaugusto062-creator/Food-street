<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="FrameStudio AI — editor de vídeo profissional no navegador, com edição local e ferramentas de IA." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>FrameStudio AI</title>
    <script>
      try {
        var t = localStorage.getItem('fs.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O FrameStudio AI precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
